name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test:unit

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm test:browser

      - run: pnpm build

  cpp:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      # mainImage takes uv and ledIndex whether or not a body reads them; unused node variables are marked in the unit.
      # The compile tests read this line, so they build with the same flags.
      CXXFLAGS: -std=c++17 -Wall -Wextra -Werror -Wno-unused-parameter -fno-exceptions -fno-rtti
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        timeout-minutes: 5

      - name: Generate the C++ units twice and require the same bytes
        timeout-minutes: 2
        run: |
          node scripts/gen-cpp-unit.ts
          cp cpp/generated/nodes.cpp cpp/generated/parity.cpp "$RUNNER_TEMP/"
          node scripts/gen-cpp-unit.ts
          cmp cpp/generated/nodes.cpp "$RUNNER_TEMP/nodes.cpp"
          cmp cpp/generated/parity.cpp "$RUNNER_TEMP/parity.cpp"

      - name: Compile every kind alone through the usermod target
        timeout-minutes: 2
        run: g++ $CXXFLAGS -I cpp -fsyntax-only cpp/generated/nodes.cpp

      - name: Build and run the op tables' numeric parity check
        timeout-minutes: 2
        run: |
          g++ $CXXFLAGS -I cpp cpp/generated/parity.cpp -o "$RUNNER_TEMP/parity"
          "$RUNNER_TEMP/parity"

      - name: Expect the texture leak fixture to fail
        timeout-minutes: 2
        run: |
          if g++ $CXXFLAGS -fsyntax-only cpp/fixtures/leak.cpp 2> "$RUNNER_TEMP/leak.log"; then
            echo "::error::cpp/fixtures/leak.cpp compiled; wledtoy.h must not provide texture()"
            exit 1
          fi
          cat "$RUNNER_TEMP/leak.log"
          # gcc quotes the name with locale quotation marks, so match the word alone
          grep -q "texture" "$RUNNER_TEMP/leak.log"
          echo "cpp/fixtures/leak.cpp failed on texture, as expected"

  rust:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      # tauri::generate_context! refuses to compile when frontendDist is missing; the Rust checks do not need its contents.
      - run: mkdir -p ../dist

      - run: cargo fmt --check

      - run: cargo clippy --all-targets -- -D warnings

      - run: cargo test
